name: Parse tracked flight issue

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'track-flight')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue body into tracked flight config
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scraper/parse_tracked_flight_issue.py

      - name: Commit tracked flight config
        run: |
          git config user.name "route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add flights/
          git diff --cached --quiet || git commit -m "Add or update tracked flight from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Tracked flight saved. It will be checked on the next scheduled run — if trip.com's search results don't include this exact flight on a given check, that check is simply recorded as not found.",
            });
