name: Manual query

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin airport code
        required: true
      destination:
        description: Destination airport code
        required: true
      date:
        description: Departure date (YYYY-MM-DD)
        required: true
      budget:
        description: Budget threshold
        required: false
        default: "999999"
      max_duration_minutes:
        description: Max flight duration in minutes
        required: false
        default: "1440"
  issue_comment:
    types: [created]

jobs:
  query:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/check')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Run manual query
        working-directory: scraper
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_ORIGIN: ${{ github.event.inputs.origin }}
          INPUT_DESTINATION: ${{ github.event.inputs.destination }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_BUDGET: ${{ github.event.inputs.budget }}
          INPUT_MAX_DURATION: ${{ github.event.inputs.max_duration_minutes }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python manual_query.py

      - name: Reply on issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('scraper/manual_query_result.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result,
            });
