name: Scrape after Pages deploy

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: write

# Same group as scrape-scheduled.yml — see that file for why. Group name
# must match exactly, or the two won't be recognized as sharing a queue.
concurrency:
  group: run-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # 只在以下条件下执行：
    # 1. pages-build-deployment 成功
    # 2. 触发的 commit 不是 scraper 自己生成的
    if: |
      github.event.workflow_run.conclusion == 'success' && 
      !contains(github.event.workflow_run.head_commit.message, '[skip pages]')
    uses: ./.github/workflows/run-scrape.yml
    secrets: inherit
