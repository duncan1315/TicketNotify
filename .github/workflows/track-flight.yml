name: Track a specific flight
description: Track the price of one specific flight (by departure/arrival time) on trip.com
title: "[flight] "
labels:
  - track-flight
body:
  - type: markdown
    attributes:
      value: |
        This tracks one specific flight across repeated searches, matched by departure/arrival time — not just "the cheapest flight on this route". If trip.com doesn't show this exact flight on a given check, that check is recorded as not found rather than guessed. In the rare case two different airlines have flights at the exact same times, this may match either one — the matched flight's airline is always shown on the results page so you can check.

  - type: input
    id: origin
    attributes:
      label: Origin airport code
      description: IATA code, for example TPE
      value: TPE
    validations:
      required: true

  - type: input
    id: destination
    attributes:
      label: Destination airport code
      value: NRT
    validations:
      required: true

  - type: input
    id: departure_date
    attributes:
      label: Departure date
      description: Format YYYY-MM-DD
      value: "2026-09-01"
    validations:
      required: true

  - type: input
    id: departure_time
    attributes:
      label: Departure time
      description: 24-hour HH:MM, as shown on trip.com for this flight
      placeholder: "08:30"
    validations:
      required: true

  - type: input
    id: arrival_time
    attributes:
      label: Arrival time
      description: 24-hour HH:MM, as shown on trip.com for this flight
      placeholder: "12:45"
    validations:
      required: true

  - type: input
    id: currency
    attributes:
      label: Currency code
      value: TWD
    validations:
      required: true

  - type: dropdown
    id: notify_channel
    attributes:
      label: Notification channel
      options:
        - discord
        - telegram
      default: 0
    validations:
      required: true
